<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A0826"/>
      <stop offset="50%" stop-color="#1E0B20"/>
      <stop offset="100%" stop-color="#0F0511"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" />
  
  <!-- Subtle Glow Ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#EC4899" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />

  <!-- Executive Silhouette Body -->
  <path d="M48 168 C48 135 70 120 100 120 C130 120 152 135 152 168 Z" fill="#3B1233" stroke="#DB2777" stroke-width="2" />
  <path d="M82 120 L100 148 L118 120 Z" fill="#FDF2F8" />
  <path d="M96 142 L100 168 L104 142 Z" fill="#D4AF37" />

  <!-- Head & Hair -->
  <circle cx="100" cy="80" r="32" fill="#FDF2F8" />
  <!-- Executive Hair Styling -->
  <path d="M66 82 C66 48 80 44 100 44 C120 44 134 48 134 82 C134 76 126 62 100 62 C74 62 66 76 66 82 Z" fill="#2E1026" />
  <path d="M68 84 C65 98 70 114 74 118 C72 106 70 96 72 86 Z" fill="#2E1026" />
  <path d="M132 84 C135 98 130 114 126 118 C128 106 130 96 128 86 Z" fill="#2E1026" />

  <!-- Executive Glasses -->
  <rect x="76" y="74" width="20" height="13" rx="3" fill="none" stroke="#D4AF37" stroke-width="2" />
  <rect x="104" y="74" width="20" height="13" rx="3" fill="none" stroke="#D4AF37" stroke-width="2" />
  <line x1="96" y1="80" x2="104" y2="80" stroke="#D4AF37" stroke-width="2" />

  <!-- Headset Mic (Customer Service Manager) -->
  <path d="M68 76 C65 72 65 64 68 60" fill="none" stroke="#D4AF37" stroke-width="2.5" />
  <path d="M68 78 C68 96 82 104 90 104" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
  <circle cx="91" cy="104" r="3" fill="#EC4899" />

  <!-- Badge / Monogram at Bottom -->
  <rect x="52" y="152" width="96" height="22" rx="11" fill="#110414" stroke="#D4AF37" stroke-width="1.5" />
  <text x="100" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="1.5">MARGARET</text>
</svg>
