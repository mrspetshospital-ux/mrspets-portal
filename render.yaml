services:
  - type: web
    name: mrspets-staging
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false          # se pega a mano desde Neon
      - key: PORTAL_USER
        sync: false
      - key: PORTAL_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
